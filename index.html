<title>Growth Challenge</title>
<style>
  /* Palette lifted from the mascot reference: warm cream ground, peach seed,
     leaf/forest green stem, olive-gold root, coral for trouble events. No
     blue - the reference art doesn't use it, so "water" leans teal-green
     instead of sky blue to stay in the same family. */
  :root{
    --bg-top:#FBEFDA; --bg-bottom:#F3DCB9; --panel:#FFFDF8; --panel-2:#F6E7CF; --card-bg:#FFFDF8;
    --ink:#4A3B2E; --ink-soft:#8A7360; --line: rgba(74,59,46,.14); --line-strong: rgba(74,59,46,.26);
    --stem:#8CC63F; --stem-deep:#2F8A4C; --root:#B58A3D; --root-deep:#8C6A2C; --seed:#F3D3C4; --seed-deep:#E0B3A0;
    --sun:#E4C062; --sun-deep:#C99A32; --wall:#A8543C; --wall-deep:#7E3D2A; --water:#4A87C0; --water-deep:#356792;
    --nutrient:#6FA84E; --nutrient-deep:#4F7F35; --danger:#E5897C; --danger-deep:#C36255;
    --soil:#C9A66C; --soil-deep:#A8824C; --sky:#BFDDEF; --sky-deep:#9BC4DE;
    --shadow:0 2px 4px rgba(74,59,46,.12), 0 10px 26px rgba(74,59,46,.16);
    --radius-sm:8px; --radius-md:14px; --radius-lg:22px;
    --font-display: -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-body: -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-top:#2B2118; --bg-bottom:#1D170F; --panel:#2F2519; --panel-2:#3A2C1C; --card-bg:#2A2016;
      --ink:#F3E6D8; --ink-soft:#C2AD97; --line: rgba(243,230,216,.14); --line-strong: rgba(243,230,216,.28);
      --stem:#9ED457; --stem-deep:#4FAE6E; --root:#D2A65C; --root-deep:#A67D3E; --seed:#F6DCCF; --seed-deep:#D9AE99;
      --sun:#F0CC7A; --sun-deep:#D1A445; --wall:#C97052; --wall-deep:#9A5138; --water:#6BA8DE; --water-deep:#4A85B8;
      --nutrient:#8CC468; --nutrient-deep:#66984A; --danger:#F0A79B; --danger-deep:#D97D6E;
      --soil:#8A6E45; --soil-deep:#6B5535; --sky:#2A3D4D; --sky-deep:#1D2B38;
      --shadow:0 2px 4px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg-top:#2B2118; --bg-bottom:#1D170F; --panel:#2F2519; --panel-2:#3A2C1C; --card-bg:#2A2016;
    --ink:#F3E6D8; --ink-soft:#C2AD97; --line: rgba(243,230,216,.14); --line-strong: rgba(243,230,216,.28);
    --stem:#9ED457; --stem-deep:#4FAE6E; --root:#D2A65C; --root-deep:#A67D3E; --seed:#F6DCCF; --seed-deep:#D9AE99;
    --sun:#E4DB9E; --sun-deep:#BFB56E; --wall:#B7A88E; --wall-deep:#8F8168; --water:#7FBCA0; --water-deep:#578E76;
    --nutrient:#D9B36C; --nutrient-deep:#B08A45; --danger:#F0A79B; --danger-deep:#D97D6E;
    --soil:#8A6E45; --soil-deep:#6B5535; --sky:#2A3D4D; --sky-deep:#1D2B38;
    --shadow:0 2px 4px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg-top:#FBEFDA; --bg-bottom:#F3DCB9; --panel:#FFFDF8; --panel-2:#F6E7CF; --card-bg:#FFFDF8;
    --ink:#4A3B2E; --ink-soft:#8A7360; --line: rgba(74,59,46,.14); --line-strong: rgba(74,59,46,.26);
    --stem:#8CC63F; --stem-deep:#2F8A4C; --root:#B58A3D; --root-deep:#8C6A2C; --seed:#F3D3C4; --seed-deep:#E0B3A0;
    --sun:#E4C062; --sun-deep:#C99A32; --wall:#A8543C; --wall-deep:#7E3D2A; --water:#4A87C0; --water-deep:#356792;
    --nutrient:#6FA84E; --nutrient-deep:#4F7F35; --danger:#E5897C; --danger-deep:#C36255;
    --soil:#C9A66C; --soil-deep:#A8824C; --sky:#BFDDEF; --sky-deep:#9BC4DE;
    --shadow:0 2px 4px rgba(74,59,46,.12), 0 10px 26px rgba(74,59,46,.16);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{
    margin:0; color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5; min-height:100vh;
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment:fixed;
  }
  h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:3px solid var(--water); outline-offset:2px; }

  /* Every screen shares this same outer frame (width, and centered on the
     same axis), so nothing jumps width or position as the player moves
     between screens - just a plain narrow centered column, not a
     viewport-breakout. */
  .app{ max-width:840px; margin:0 auto; padding:22px 20px 56px; box-sizing:border-box; }

  .masthead{ margin-bottom:18px; text-align:center; }
  .masthead h1{
    font-size:clamp(1.8rem, 1.1rem + 2.6vw, 2.7rem); font-weight:800; letter-spacing:-.01em;
    color:var(--stem-deep);
    animation: title-in .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @media (prefers-reduced-motion: reduce){ .masthead h1{ animation:none; } }
  @keyframes title-in{ from{ opacity:0; transform:translateY(-6px) scale(.96);} to{ opacity:1; transform:none; } }

  .primary-btn{
    background:var(--stem); color:#fff; border:none; border-radius:999px;
    padding:16px 34px; font-size:1.2rem; font-weight:800; letter-spacing:.01em; cursor:pointer;
    box-shadow:0 4px 0 var(--stem-deep), var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .primary-btn:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  .primary-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--stem-deep); }
  .primary-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:0 4px 0 var(--stem-deep); }
  .ghost-btn{
    background:transparent; color:var(--ink-soft); border:none; text-decoration:underline;
    font-size:.8rem; font-weight:700; cursor:pointer; padding:6px 8px;
  }
  .ghost-btn:hover{ color:var(--ink); }
  /* Always-on-top escape hatch, independent of whichever screen is showing
     inside .app, so a group can bail out and start over from any point. */
  .restart-fab{
    position:fixed; top:16px; right:16px; z-index:40;
    display:flex; align-items:center; gap:7px; background:var(--card-bg); color:var(--ink-soft);
    border:2px solid var(--line-strong); border-radius:999px; padding:9px 16px 9px 12px;
    font-size:.85rem; font-weight:700; cursor:pointer; box-shadow:var(--shadow);
    transition:color .12s ease, transform .12s ease;
  }
  .restart-fab .icon-svg{ width:16px; height:16px; }
  .restart-fab:hover{ color:var(--ink); transform:translateY(-1px); }
  .restart-fab:active{ transform:translateY(0); }
  @media (max-width:520px){ .restart-fab span{ display:none; } .restart-fab{ padding:10px; } }

  /* ---------- setup ---------- */
  .setup-card{
    background:var(--panel); border-radius:var(--radius-lg); padding:26px;
    box-shadow:var(--shadow); display:grid; gap:20px; border:1px solid var(--line);
    max-width:640px; margin:0 auto;
  }
  .field-row{ display:grid; grid-template-columns: 1fr; gap:8px; }
  .field-row label{ font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .field-row input[type=number]{
    width:100%; max-width:120px; padding:9px 12px; border-radius:var(--radius-sm);
    border:2px solid var(--line-strong); background:var(--panel-2); color:var(--ink); font-size:1.05rem; font-weight:600;
  }
  input[type=range]{ width:100%; accent-color:var(--stem); }
  .radius-hint{ font-size:.78rem; color:var(--ink-soft); }
  .group-name-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .group-name-grid input{
    width:100%; padding:9px 12px; border-radius:var(--radius-sm); border:2px solid var(--line-strong);
    background:var(--panel-2); color:var(--ink); font-size:.9rem; font-weight:600;
  }
  .group-swatch{ display:inline-block; width:.8em; height:.8em; border-radius:50%; margin-right:6px; vertical-align:middle; box-shadow:0 0 0 2px rgba(255,255,255,.5) inset; }

  .mode-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mode-option{
    display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
    padding:12px 10px; border-radius:var(--radius-sm); border:2px solid var(--line-strong);
    background:var(--panel-2); color:var(--ink); font-family:inherit; cursor:pointer;
  }
  .mode-option .mode-title{ font-family:var(--font-display); font-weight:800; font-size:1.05rem; }
  .mode-option .mode-sub{ font-size:.72rem; color:var(--ink-soft); }
  .mode-option.selected{ border-color:var(--stem); background:color-mix(in srgb, var(--stem) 16%, var(--panel-2)); }
  .mode-option.selected .mode-title{ color:var(--stem-deep); }

  /* ---------- ready screen ---------- */
  .ready-screen{ display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center; padding:24px 0; }
  .ready-screen h2{ font-size:1.7rem; font-weight:800; }
  .ready-list{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:480px; }
  .ready-chip{
    display:flex; align-items:center; gap:7px; background:var(--panel); border-radius:999px;
    padding:9px 18px; font-weight:700; box-shadow:var(--shadow); font-size:1.05rem;
  }

  /* ---------- interactive tutorial ---------- */
  /* Same shape as the growth screen (instruction card above a board, result
     banner below) since it's teaching that exact screen by having the
     player actually use a scaled-down version of it, not just describing it. */
  .tutorial-screen{
    display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
    width:100%; padding:8px 0 24px;
  }
  .tutorial-screen h2{ font-size:1.6rem; font-weight:800; }
  .tutorial-instruction{ display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; }
  .tutorial-goal{
    font-family:var(--font-display); font-weight:800; font-size:1.15rem; color:var(--stem-deep);
    background:var(--panel-2); padding:12px 26px; border-radius:999px;
  }

  /* ---------- turn intro ---------- */
  .turn-intro{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    min-height:46vh; text-align:center;
  }
  /* Fixed at roughly the same height the board's own center lands at on the
     growth screen (the board dominates that layout, so its middle sits
     close to the viewport's vertical center) - so tapping Draw and then
     tapping cells on the board don't jump between a high spot and a low
     one. Big touch display in a classroom, so a consistent tap height
     matters more than technically being reachable-but-in-a-different-spot
     every screen. */
  #drawBtn{
    position:fixed; left:50%; top:50vh; transform:translate(-50%,-50%); z-index:15;
  }
  .turn-intro .name{
    font-family:var(--font-display); font-size:2.3rem; font-weight:800;
    animation: name-in .4s cubic-bezier(.2,1.6,.3,1) both;
  }
  @keyframes name-in{ from{ transform:scale(.85); opacity:0;} to{ transform:scale(1); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .turn-intro .name{ animation:none; } }
  .turn-intro .round{ color:var(--ink-soft); font-size:.95rem; font-weight:700; letter-spacing:.03em; }

  /* ---------- outcome modal (setbacks only) ---------- */
  /* Shared by the slot-machine roll/land states below - one draw button
     always leads to this same reveal screen, whether it turns out to be a
     growth choice or a setback, so the interface itself never gives away
     which kind was drawn before the roll finishes. */
  @keyframes roll-jitter{
    0%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-2px) scale(1.04); } 100%{ transform:translateY(0) scale(1); }
  }
  @keyframes land-bounce{
    0%{ transform:scale(1.16) rotate(-2deg); } 45%{ transform:scale(.94) rotate(1deg); } 100%{ transform:scale(1) rotate(0); }
  }

  /* ---------- draw reveal (pick one of two cards) ---------- */
  /* An inline screen like turn-intro/growth-screen, not a popup - so it
     never sits on top of the board, just replaces the current screen. */
  /* .app is already the full breakout width now, so this just fills it. */
  .choice-screen{
    display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;
    width:100%;
  }
  /* Board, then group pill/title/card, stacked in one centered column -
     there's no second option needing its own side-by-side column anymore
     now that a draw only ever reveals one outcome. */
  .choice-layout{
    display:flex; flex-direction:column; align-items:center; gap:16px; width:100%;
  }
  .choice-status{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .side-title{ font-size:1.1rem; font-weight:800; text-align:center; }
  .choice-options{
    display:flex; flex-direction:column; gap:14px; width:100%; justify-content:center;
  }
  /* Purely a display card now (the draw only ever lands on one outcome,
     nothing to pick), so no hover/cursor affordance. */
  .choice-option{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 14px;
    border-radius:var(--radius-md); border:2px solid var(--line-strong); background:var(--panel-2);
  }
  .choice-icon{ width:56px; height:56px; position:relative; }
  .choice-icon .icon-svg{ width:100%; height:100%; }
  .choice-title{ font-family:var(--font-display); font-weight:800; font-size:1.05rem; }
  .choice-desc{ font-size:.88rem; color:var(--ink-soft); min-height:1.25em; }
  /* How many cells grow/are removed, at a glance - overlaid on the icon
     instead of buried in the description text. */
  .step-badge{
    position:absolute; bottom:-4px; right:-4px; min-width:22px; height:22px; padding:0 5px;
    border-radius:999px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:800; font-size:.72rem; color:#fff;
    box-shadow:var(--shadow); z-index:3;
  }
  .step-badge.positive{ background:var(--stem-deep); }
  .step-badge.negative{ background:var(--danger-deep); }

  /* slot-machine roll for the reveal card */
  .choice-option.rolling{ animation: choice-roll-glow .32s ease-in-out infinite; }
  @keyframes choice-roll-glow{
    0%,100%{ box-shadow:none; }
    50%{ box-shadow:0 0 0 4px color-mix(in srgb, var(--stem) 28%, transparent); }
  }
  .choice-option.rolling .choice-icon{ animation: roll-jitter .1s linear infinite; }
  .choice-option.landed{ animation: land-bounce .5s cubic-bezier(.2,1.8,.3,1); }
  @media (prefers-reduced-motion: reduce){
    .choice-option.rolling, .choice-option.rolling .choice-icon, .choice-option.landed{ animation:none; }
  }

  /* ---------- growth screen ---------- */
  /* Same width as choice-screen (both just fill .app) and the same .wide
     board size, so picking a direction and picking where to grow present
     the same size board, not a bigger one that then shrinks back down. */
  .growth-screen{
    display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center;
    width:100%;
  }
  /* Group name and score as two separate side-by-side chips, rather than
     one combined "Name · N pts" pill - the score reads at a glance instead
     of being buried in smaller text next to the name. */
  .status-row{ display:flex; gap:12px; width:100%; max-width:420px; }
  .group-chip{
    flex:1; background:var(--card-bg); border-radius:999px; padding:11px 16px; box-shadow:var(--shadow);
    font-family:var(--font-display); font-weight:800; font-size:1.05rem;
    display:flex; align-items:center; justify-content:center; text-align:center; min-width:0;
  }
  .score-chip{
    flex:1; background:var(--card-bg); border-radius:999px; padding:7px 16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
  }
  .score-chip .score-num{ font-family:var(--font-mono); font-weight:800; font-size:1.8rem; color:var(--stem-deep); }
  .score-chip .score-label{ font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
  .growth-instruction{ display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; }
  /* Same "small card" look as .choice-option, so the event you picked (or
     the setback you drew) keeps showing here, in the same spot, instead of
     collapsing into a bare instruction line once you reach the board. */
  .event-card{
    display:flex; align-items:center; gap:12px; text-align:left;
    padding:10px 16px; border-radius:var(--radius-md); border:2px solid var(--line-strong);
    background:var(--card-bg); max-width:420px; width:100%;
  }
  .event-card-icon{ width:44px; height:44px; flex:none; position:relative; }
  .event-card-icon .icon-svg{ width:100%; height:100%; }
  .event-card-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .event-card-title{ font-family:var(--font-display); font-weight:800; font-size:1rem; }
  .event-card-desc{ font-size:.85rem; color:var(--ink-soft); }
  .no-effect-text{ font-family:var(--font-display); font-weight:800; font-size:.95rem; color:var(--danger-deep); }

  /* Reference design: the board itself is four solid quadrant colors
     (sun/wall on top, nutrient/water on bottom) filling the whole square.
     The growable diamond area only ever reaches a bowtie/hourglass shape
     from the seed to each edge (see renderBoardInto), so it never covers
     the corners - the badges just sit there directly, on the quadrant's
     own color, with no separate frame or padding needed. */
  /* board-stage is the white frame (matches the reference art); board-inner
     is the four-quadrant colored square inset within it, sized off its own
     box so the cell grid math (in renderBoardInto) uses the inner area, not
     the frame. */
  .board-stage{
    position:relative; margin:0 auto; aspect-ratio:1/1; width:100%; max-width:500px;
    background:var(--card-bg); padding:3.2%; box-sizing:border-box;
    border-radius:var(--radius-lg); border:2px solid var(--line-strong); box-shadow:var(--shadow);
  }
  .board-stage.wide{ max-width:736px; }
  /* Both halves are flat single tones now - sky above, soil below - since
     growth in either half is freeform (not tied to a left/right zone), a
     split-color half would wrongly imply a zone that no longer exists.
     Sunlight/water/nutrient/wall are all just scattered or fixed tokens on
     individual cells instead (see renderBoardInto). */
  .board-inner{
    position:relative; width:100%; height:100%; border-radius:var(--radius-md); overflow:hidden;
    background:linear-gradient(to bottom, var(--sky) 50%, var(--soil) 50%);
  }
  /* A finished board keeps a steady gold glow so "this one's done" reads at
     a glance, not just during the one-off celebration animation. */
  .board-stage.finished, .mini-stage.finished{
    border-color:var(--sun-deep);
    box-shadow:inset 0 0 0 1px var(--line), 0 0 0 4px var(--sun-deep), 0 0 22px 3px color-mix(in srgb, var(--sun) 65%, transparent);
    animation: finished-glow 2.4s ease-in-out infinite;
  }
  @keyframes finished-glow{
    0%,100%{ box-shadow:inset 0 0 0 1px var(--line), 0 0 0 4px var(--sun-deep), 0 0 18px 2px color-mix(in srgb, var(--sun) 55%, transparent); }
    50%{ box-shadow:inset 0 0 0 1px var(--line), 0 0 0 4px var(--sun-deep), 0 0 28px 6px color-mix(in srgb, var(--sun) 75%, transparent); }
  }
  @media (prefers-reduced-motion: reduce){ .board-stage.finished, .mini-stage.finished{ animation:none; } }
  .icon-svg{ width:1em; height:1em; display:block; }

  /* Cells are individually rotated 45° and sized to their diagonal
     neighbor's spacing so they tile edge-to-edge; only rendered within
     |col| <= |row| (the bowtie the stem/root can actually reach), so the
     quadrant color shows through everywhere else, including the corners. */
  /* Soft shadow under the whole grown-area silhouette, so the cream diamond
     region reads as raised above the colored quadrants (matches the
     reference art) - filter follows each tile's actual shape, not a boxy
     rectangle. */
  .cell-layer{ position:absolute; inset:0; filter:drop-shadow(0 3px 5px rgba(20,15,10,.25)); }
  .cell{
    position:absolute; transform:translate(-50%,-50%) rotate(45deg);
    box-sizing:border-box; border:1px solid var(--line-strong);
    background:var(--panel-2);
  }
  /* Grown cells have no flat fill or border of their own - the connected
     "vine" shape drawn inside (see connectionShapeSvg) supplies all the
     visible color, so a run of same-type cells reads as one continuous
     shape flowing across the grid instead of a checkerboard of separate
     diamonds. */
  .cell.seed, .cell.stem, .cell.root{ background:transparent; border:none; }
  .cell.seed{ z-index:3; }
  /* Raised brick look: the extra box-shadow offset is (h,v) with h==v
     because .cell is already rotated 45deg - an equal-h/v local offset is
     the one combination that lands as a straight-down shadow on screen
     (see the cell's own rotate(45deg): local "right" maps to screen
     down-right, local "down" maps to screen down-left, so h==v cancels the
     sideways component and leaves only "down"). z-index lifts it above
     neighboring cells so the shadow isn't clipped underneath them. */
  .cell.wall{
    background:var(--wall); z-index:2;
    box-shadow:inset 0 0 0 2px var(--wall-deep), 4px 4px 6px rgba(20,10,5,.45);
  }
  /* Sits in the cell's own rotated frame (not counter-rotated) since the
     arms are defined in terms of that frame's own 4 edges. */
  .cell-vine{ position:absolute; inset:0; width:100%; height:100%; }
  /* Resource tokens sit on top of an otherwise-empty cell and disappear
     once grown into - so they reuse .cell.empty's own color and just add
     an icon overlay. */
  .cell-token{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    transform:rotate(-45deg); pointer-events:none;
  }
  .cell-token .icon-svg{ width:60%; height:60%; }
  /* Small permanent decoration on a stem cell that caught sunlight - sits
     off to one side rather than dead-center on the vine, like a leaf
     actually growing out from the side of the stem instead of a badge
     stuck in the middle of it. */
  .cell-leaf{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-start;
    padding-left:6%; transform:rotate(-45deg); pointer-events:none; z-index:2;
  }
  .cell-leaf .icon-svg{ width:68%; height:68%; }
  /* Blooms on the winner's board on the results screen - bigger than a

  // Small procedural blips/chimes via Web Audio - no audio files to embed,
  // and the context only gets created on first use (most browsers refuse

  function getAudioCtx(){

      if(Ctx){ try{ audioCtx = new Ctx(); }catch(e){} }

    var ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    freqs.forEach(function(f, i){
      var t = ctx.currentTime + i * noteDur;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(.16, t + .01);
      gain.gain.exponentialRampToValueAtTime(.001, t + noteDur * .9);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + noteDur);
    });

  // Autotile-style shape system: instead of filling a cell's whole diamond
  // with flat color, draw a rounded "arm" toward each diagonal neighbor
  // that's actually the same growing part (or the seed), so a run of
  // stem/root cells reads as one continuous vine instead of a checkerboard
  // of separate blocks. Order matches how a cell's own 45°-rotated square
  // maps onto its 4 screen-diagonal neighbors: the square's own top/right/
  // bottom/left edges end up facing screen up-right/down-right/down-left/
  // up-left once .cell's rotate(45deg) is applied - so "up-left neighbor"
  // corresponds to the SVG's own left edge, and so on around clockwise.
  var CONN_DELTAS = [ // [up-left, up-right, down-right, down-left]
    {dc:-1,dr:-1}, {dc:1,dr:-1}, {dc:1,dr:1}, {dc:-1,dr:1}
  ];

  // existing cells (a real structural loop, now that stem/root can grow in
  // any of the 4 directions) - but the drawing itself should still read as
  // a single branching plant, not a closed ring. So rendering doesn't use
  // raw adjacency: it walks a BFS spanning tree from the seed once per
  // render and only draws the edges that tree actually used, silently
  // dropping whichever extra adjacency would have closed a loop.
  function buildSpanningParents(group){

    var visited = {}; visited[seedKey] = true;
    var queue = [seedKey];
    while(queue.length){
      var cur = queue.shift();
      var p = cur.split(','), c = +p[0], r = +p[1];

        var nk = key(c+d.dc, r+d.dr);

        visited[nk] = true;
        parent[nk] = cur;
        queue.push(nk);
      });

    return parent;

    var myKey = key(col,row);

      return parent[nk] === myKey || parent[myKey] === nk;
    });

  // (rx = half the arm's thickness gives a clean rounded cap on both ends,
  // no separate arc path needed). Index order matches CONN_DELTAS.

  function connectionShapeSvg(conn, fillVar){

    return '<svg class="cell-vine" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +

  // Every token type (water, nutrient, wall, sunlight) gets the same count,
  // scaled to board size, so none of them visually dominates the board.
  function tokenCountFor(R){ return Math.max(2, Math.round(R * 0.9)); }

  function lowerHalfCells(R){
    var cells = [];
    for(var row=1; row<=R; row++){
      for(var col=-row; col<=row; col+=2) cells.push(key(col,row));
    }
    return cells;
  }
  function upperHalfCells(R){
    var cells = [];
    for(var row=-R; row<=-1; row++){
      var maxCol = Math.abs(row);
      for(var col=-maxCol; col<=maxCol; col+=2) cells.push(key(col,row));

      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;

  function generateResources(R){
    var count = tokenCountFor(R);
    var pool = shuffle(lowerHalfCells(R));
    var out = {};
    for(var i=0; i<pool.length && i<count; i++) out[pool[i]] = 'water';
    for(var i=count; i<pool.length && i<count*2; i++) out[pool[i]] = 'nutrient';
    return out;
  }
  // True if every non-wall cell in the upper half can still be reached from
  // the seed through a chain of non-wall cells (any of the 4 diagonals,
  // same as how stem actually grows) - i.e. this wall layout never strands
  // a cell behind an unbreakable wall of walls.
  function upperHalfFullyReachable(R, walls){
    var open = upperHalfCells(R).filter(function(k){ return !walls[k]; });
    var openSet = {};
    open.forEach(function(k){ openSet[k] = true; });
    var deltas = [{dc:-1,dr:-1},{dc:1,dr:-1},{dc:-1,dr:1},{dc:1,dr:1}];
    var visited = {}, stack = [key(0,0)];
    visited[key(0,0)] = true;
    while(stack.length){
      var cur = stack.pop();
      var p = cur.split(','), c = +p[0], r = +p[1];
      deltas.forEach(function(d){
        var nc = c+d.dc, nr = r+d.dr;
        if(nr >= 0) return; // stays in the upper/stem half

        if(Math.abs(nc) > Math.abs(nr)) return; // bowtie shape
        var nk = key(nc,nr);
        if(visited[nk] || !openSet[nk]) return;
        visited[nk] = true;
        stack.push(nk);
      });
    }
    return open.every(function(k){ return visited[k]; });
  }
  // Walls are permanent (never consumed like a resource) - a stem cell that
  // grows next to one triggers the once-per-turn bonus in onCellClick, and
  // the same wall can trigger it again on a later turn. Generated before
  // sunlight, since sunlight's shadows depend on where the walls land.
  // Added one at a time, skipping any candidate that would strand a cell -
  // a wall can slow growth down or force a detour, but can never fully
  // block a position off from ever being grown into.
  function generateWalls(R){
    var count = tokenCountFor(R);
    var pool = shuffle(upperHalfCells(R));
    var out = {};
    var placed = 0;
    for(var i=0; i<pool.length && placed<count; i++){
      var candidate = pool[i];
      out[candidate] = true;
      if(upperHalfFullyReachable(R, out)) placed++;

  // sit on, so a candidate only catches light if nothing blocks the
  // straight line back to the board's edge along that diagonal - a wall
  // casts a real shadow on whatever's directly behind it (toward the seed).
  // Split into "find the eligible cells" and "place a fixed number of
  // tokens into them" so setup can look at every group's candidate pool
  // first and give them all the same sunlight count (see el('startBtn') -
  // unlike walls/water/nutrient, which always place a fixed count, a wall

  // the one resource whose count could otherwise differ group to group).
  function sunlightCandidates(R, walls){

      var c = col, r = row;
      while(true){
        c -= 1; r -= 1;
        if(Math.max(Math.abs(c),Math.abs(r)) > R) break; // reached the board's edge - clear path

  // Score = cells actually grown (seed doesn't count) + collected resource

  // different groups' turns, so comparing "old displayed number" to "new

    var wallsList = [], sunCandidatesList = [];

  // so the interface itself never gives away which kind was drawn before
  // the roll lands. There's no longer a choice of *which* outcome - the
  // player's agency is entirely in *where* it lands (or, for a setback,
  // which existing cell gets removed).
  function startDraw(){
    var group = currentGroup();
    var kind = group.drawDeck[group.drawIndex % group.drawDeck.length];
    group.drawIndex++;
    if(kind === 'damage'){
      var picked = SETBACK_OUTCOMES[Math.floor(Math.random()*SETBACK_OUTCOMES.length)];
      showDrawReveal(picked, function(){
        if(removableCells(group, picked.part).length === 0){ enterNoEffectPhase(picked); return; }
        state.pending = { outcome: picked, remaining: 1 };
        enterGrowthPhase(picked);
      });
      return;
    }

    // Only offer branches that actually have room - this is also what
    // fixes the "grown to the limit, drew the same direction again, board
    // has nothing to click" stuck state: a maxed-out branch just never
    // gets drawn. (In practice a fully-grown group never reaches here at
    // all, since showTurnIntro skips its draw - this is just a safety net.)
    var pool = GROWTH_OUTCOMES.filter(function(o){ return computeGrowthTargets(group, o).length > 0; });
    if(pool.length === 0){
      checkMaturity(group);
      var placeholder = { icon:ICON_BLOCKED, title:'Nothing to Grow', desc:'Every direction is already full.' };
      showDrawReveal(placeholder, function(){ enterNoEffectPhase(placeholder); });
      return;
    }
    var picked = pool[Math.floor(Math.random()*pool.length)];
    showDrawReveal(picked, function(){
      state.pending = { outcome: picked, remaining: picked.steps, grown: 0 };
      enterGrowthPhase(picked);
    });
  }

  // Slot-machine style reveal: flick the card through random outcomes,
  // slowing down, before landing on the one actually drawn. onContinue()
  // runs once the player taps the landed card.
  function showDrawReveal(outcome, onContinue){
    hide(el('turnIntro'));
    // Show the screen BEFORE measuring the board: while choiceOverlay is
    // still [hidden], choiceBoardStage has display:none and getBoundingClientRect()
    // reports 0 width, so the cell grid was getting sized for the wrong
    // (fallback) width and only filling part of the actual board once it
    // appeared.
    show(el('choiceOverlay'));
    var group = currentGroup();
    refreshChoiceStatus(group);
    renderBoardInto(el('choiceBoardStage'), el('choiceCellLayer'), group, false);
    el('revealOverlay').classList.add('active');

    var wrap = el('choiceOptions');
    wrap.innerHTML = '';
    var card = buildChoiceOptionShell();
    wrap.appendChild(card);
    var continueBtn = el('revealContinueBtn');
    hide(continueBtn);

    // Waits for a tap rather than auto-advancing, so the teacher has time
    // to talk through the event with the class before moving on.
    function land(){
      landChoiceOption(card, outcome);
      sfxLand();
      show(continueBtn);
      continueBtn.onclick = function(){
        hide(continueBtn);
        el('revealOverlay').classList.remove('active');
        hide(el('choiceOverlay'));
        onContinue(outcome);
      };
    }

    if(REDUCE_MOTION){ land(); return; }

    card.classList.add('rolling');
    var delays = [70,70,80,90,100,120,150,190,240,300,380];
    var i = 0;
    function tick(){
      flashChoiceOption(card, OUTCOMES[Math.floor(Math.random()*OUTCOMES.length)]);
      sfxTick();
      i++;
      if(i < delays.length){
        setTimeout(tick, delays[i]);
      } else {
        card.classList.remove('rolling');
        land();
      }
    }
    setTimeout(tick, delays[0]);
  }

  function buildChoiceOptionShell(){
    var card = document.createElement('div');
    card.className = 'choice-option';
    card.innerHTML =
      '<span class="choice-icon"></span>' +
      '<span class="choice-title"></span>' +
      '<span class="choice-desc"></span>';
    return card;
  }

  // "+1"/"+2"/"-1" badge overlaid on an icon, so the cell count reads at a
  // glance instead of only being buried in the description text.
  function stepBadgeHtml(outcome){
    var steps = outcome.steps;
    if(!steps) return '';
    var cls = steps > 0 ? 'positive' : 'negative';
    return '<span class="step-badge ' + cls + '">' + (steps > 0 ? '+' : '') + steps + '</span>';
  }

  function flashChoiceOption(btn, outcome){
    btn.querySelector('.choice-icon').innerHTML = outcome.icon + stepBadgeHtml(outcome);
    btn.querySelector('.choice-title').textContent = outcome.title;
  }

  function landChoiceOption(btn, outcome){
    btn.querySelector('.choice-icon').innerHTML = outcome.icon + stepBadgeHtml(outcome);
    btn.querySelector('.choice-title').textContent = outcome.title;
    btn.querySelector('.choice-desc').textContent = outcome.desc;
    btn.classList.add('landed');
  }

  // ---------- phase 3: growth screen ----------
  function enterGrowthPhase(outcome){
    var g = currentGroup();
    refreshGrowthStatus(g);
    el('resultSlot').innerHTML = '';
    show(el('growthScreen'));
    updateGrowthInstruction();
    renderBoard();
  }

  // Once-per-turn wall bonus: reuses the normal growth click flow via a
  // one-off outcome on the regular 'stem' branch, so its targets are just
  // whatever's currently open anywhere around the plant (not only next to
  // the wall that triggered it) - pickups (a bonus cell can still land on a
  // sunlight token, say) and maturity checks all work exactly like a normal
  // step. previousPoints carries the original step's points through so the
  // final banner shows one combined total, not a separate "wall bonus" line.
  function startWallBonus(group, previousPoints){
    var pool = computeGrowthTargets(group, { branch:'stem' });
    var n = Math.min(1, pool.length);
    var bonusOutcome = {
      kind:'growth', branch:'stem', steps: n,
      icon: ICON_WALL, title:'Wall Bonus!', desc:'Found a wall - pick where to grow!',
      previousPoints: previousPoints
    };
    state.pending = { outcome: bonusOutcome, remaining: n, grown: 0 };
    updateGrowthInstruction();
    renderBoard();
  }

  function eventCardHtml(outcome){
    return '<div class="event-card">' +
        '<span class="event-card-icon">'+outcome.icon + stepBadgeHtml(outcome)+'</span>' +
        '<span class="event-card-text">' +
          '<span class="event-card-title">'+outcome.title+'</span>' +
          '<span class="event-card-desc">'+outcome.desc+'</span>' +
        '</span>' +
      '</div>';
  }
  function updateGrowthInstruction(){
    el('growthInstruction').innerHTML = eventCardHtml(state.pending.outcome);
  }
  // A draw that landed but has nowhere to apply (nothing left to grow, or
  // nothing left to prune/rot) still shows the board and the event card -
  // just with a red "No Effect" instead of a tappable target, plus a
  // denial sound, rather than silently skipping straight to the next turn.
  function enterNoEffectPhase(outcome){
    var g = currentGroup();
    refreshGrowthStatus(g);
    el('resultSlot').innerHTML = '';
    show(el('growthScreen'));
    el('growthInstruction').innerHTML = eventCardHtml(outcome) + '<div class="no-effect-text">No Effect</div>';
    renderBoard();
    sfxDenied();
    finishStep('No Effect', false);
  }

  // A wall cell is a fixed landmark, not a growable spot - the stem grows
  // *beside* it (see isAdjacentToWall), never onto it.
  function computeGrowthTargets(group, outcome){
    var b = BRANCHES[outcome.branch];
    var seen = {}, out = [];
    Object.keys(group.cells).forEach(function(k){
      var type = group.cells[k];
      if(type !== 'seed' && type !== b.part) return;
      var p = k.split(','), acol = +p[0], arow = +p[1];
      b.deltas.forEach(function(d){
        var tcol = acol + d.dc, trow = arow + d.dr;
        var tkey = key(tcol,trow);
        if(group.cells[tkey] || seen[tkey]) return;
        if(Math.max(Math.abs(tcol),Math.abs(trow)) > state.radius) return;
        // Growing toward the seed's row is only meaningful while staying
        // inside the bowtie shape (|col|<=|row|) - stem's now-bidirectional
        // deltas can otherwise step just outside it, onto a cell the board
        // never actually renders.
        if(Math.abs(tcol) > Math.abs(trow)) return;
        // Stem never crosses into the lower half and root never crosses
        // into the upper half, even with all 4 directions now in play -
        // explicit here rather than only relying on the seed happening to
        // occupy the sole row-0 crossing cell.
        if(b.part === 'stem' && trow >= 0) return;
        if(b.part === 'root' && trow <= 0) return;
        if(group.walls[tkey]) return;
        seen[tkey] = true;
        out.push({ col:tcol, row:trow });
      });
    });
    return out;
  }

  // Whether (col,row) sits diagonally next to any wall cell - checked right
  // after a stem cell is placed there, to decide if the once-per-turn wall
  // bonus should fire.
  function isAdjacentToWall(group, col, row){
    return [{dc:-1,dr:-1},{dc:1,dr:-1},{dc:-1,dr:1},{dc:1,dr:1}].some(function(d){
      return !!group.walls[key(col+d.dc, row+d.dr)];
    });
  }
  // Which cells of the given part a setback can safely remove without
  // splitting the rest of that part away from the seed - i.e. every other
  // own-part cell must still reach the seed through a chain of adjacent
  // own-part cells once this one is gone. A leaf is always safe; anything
  // that's the sole link between the seed and further-out cells isn't.
  function removableCells(group, part){
    var keys = Object.keys(group.cells).filter(function(k){ return group.cells[k] === part; });
    var deltas = [{dc:-1,dr:-1},{dc:1,dr:-1},{dc:-1,dr:1},{dc:1,dr:1}];
    function reachableWithout(skipKey){
      var keySet = {};
      keys.forEach(function(k){ if(k !== skipKey) keySet[k] = true; });
      var visited = {}, stack = [key(0,0)];
      visited[key(0,0)] = true;
      while(stack.length){
        var cur = stack.pop();
        var p = cur.split(','), c = +p[0], r = +p[1];
        deltas.forEach(function(d){
          var nk = key(c+d.dc, r+d.dr);
          if(visited[nk] || !keySet[nk]) return;
          visited[nk] = true;
          stack.push(nk);
        });
      }
      return visited;
    }
    return keys.filter(function(rk){
      var visited = reachableWithout(rk);
      return keys.every(function(k){ return k === rk || visited[k]; });
    }).map(function(k){ var p = k.split(','); return { col:+p[0], row:+p[1] }; });
  }

  function currentValidTargets(){
    if(!state.pending) return [];
    var group = currentGroup();
    var outcome = state.pending.outcome;
    if(outcome.kind === 'growth') return computeGrowthTargets(group, outcome);
    return removableCells(group, outcome.part);
  }

  function onCellClick(col,row){
    if(!state.pending || state.viewingIndex !== state.currentIndex) return;
    var group = currentGroup();
    var outcome = state.pending.outcome;
    var targets = currentValidTargets();
    var isMatch = targets.some(function(t){ return t.col===col && t.row===row; });
    if(!isMatch){ flashInvalid(col,row); return; }

    if(outcome.kind === 'growth'){
      var b = BRANCHES[outcome.branch];
      var k = key(col,row);
      group.cells[k] = b.part;
      (b.part === 'stem' ? group.stemOrder : group.rootOrder).push(k);
      state.pending.grown++;

      // Landing on a water/nutrient/sunlight token scores it immediately
      // and consumes it.
      if(group.resources[k]){
        var resType = group.resources[k];
        delete group.resources[k];
        group.score += 1;
        state.pending.bonusPoints = (state.pending.bonusPoints || 0) + 1;
        // Sunlight cells get a little leaf mark, permanently - a small nod
        // to "this bit of stem is the one that actually caught the light."
        if(resType === 'sunlight') group.litCells[k] = true;
      }
      // A stem cell planted beside a wall triggers a once-per-turn bonus:
      // 1 more player-picked cell, free. Remembered here and resolved after
      // this step fully lands, so it can't fire mid-step.
      if(b.part === 'stem' && !state.turnWallBonusUsed && isAdjacentToWall(group, col, row)){
        state.pending.wallTrigger = { col: col, row: row };
      }
      // Every successful placement raises totalScore by at least 1 (the
      // cell itself), possibly +1 more for a pickup above - one chime per
      // click covers both rather than layering two sounds.
      sfxScoreUp();

      state.pending.remaining--;
      var stepDone = state.pending.remaining <= 0;
      // A bonus (grow x2) step can also run out of room after its first
      // click - if so, stop here instead of leaving an unclickable board.
      if(!stepDone && computeGrowthTargets(group, outcome).length === 0) stepDone = true;

      if(stepDone){
        // Check maturity (and clear pending) BEFORE the re-render below,
        // otherwise renderBoard() recomputes the *next* legal targets for
        // an outcome that's already over and leaves a highlighted cell
        // glowing with no click handler still wired to anything.
        var justMatured = checkMaturity(group);
        // Just the total points this step added (cells grown + any pickup
        // bonus combined, plus whatever the original step already earned if
        // this is the wall-bonus continuation) - one combined figure for the
        // whole turn, never a separate "wall bonus +N" line.
        var stepPoints = state.pending.grown + (state.pending.bonusPoints || 0) + (outcome.previousPoints || 0);

        var wallTrigger = state.pending.wallTrigger;
        state.pending = null;
        var bonusPool = wallTrigger ? computeGrowthTargets(group, { branch:'stem' }) : [];
        if(bonusPool.length > 0){
          state.turnWallBonusUsed = true;
          renderBoard();
          refreshGrowthStatus(group);
          startWallBonus(group, stepPoints);
          return;
        }

        var msg = '+' + stepPoints + ' points';
        if(justMatured) msg += ' — fully grown!';

        renderBoard();
        refreshGrowthStatus(group);
        finishStep(msg, justMatured);
      } else {
        renderBoard();
        refreshGrowthStatus(group);
        updateGrowthInstruction();
      }
    } else {
      var removedKey = key(col,row);
      delete group.cells[removedKey];
      var orderArr = outcome.part === 'stem' ? group.stemOrder : group.rootOrder;
      var idx = orderArr.indexOf(removedKey);
      if(idx !== -1) orderArr.splice(idx, 1);
      var msg2 = '-1 points';
      state.pending = null;
      sfxSetback();
      renderBoard();
      refreshGrowthStatus(group);
      finishStep(msg2, false);
    }
  }

  function flashInvalid(col,row){
    var target = document.querySelector('#cellLayer [data-col="'+col+'"][data-row="'+row+'"]');
    if(!target) return;
    target.classList.remove('shake');
    void target.offsetWidth;
    target.classList.add('shake');
  }

  // True if this group's turn is the very last one before the fixed round
  // count runs out - drives the "See Results" vs "Next Group" button label.
  function willGameEnd(){
    var n = state.groups.length;
    var next = (state.currentIndex+1) % n;
    var nextRound = (next <= state.currentIndex) ? state.round+1 : state.round;
    return nextRound > state.maxRounds;
  }

  function finishStep(message, celebrated){
    state.pending = null;
    if(celebrated) fireCelebration();
    var isLast = willGameEnd();

    var slot = el('resultSlot');
    slot.innerHTML = '';
    var banner = document.createElement('div');
    banner.className = 'result-banner';
    var msg = document.createElement('div');
    msg.textContent = message;
    var nextBtn = document.createElement('button');
    nextBtn.className = 'primary-btn';
    nextBtn.textContent = isLast ? 'See Results' : 'Next Group →';
    banner.appendChild(msg);
    banner.appendChild(nextBtn);
    slot.appendChild(banner);

    // Waits for a tap rather than auto-advancing, same as the reveal card
    // and the overview screen - so nothing rushes past before the teacher
    // (or the group itself) has actually seen the result.
    nextBtn.addEventListener('click', function(){
      if(isLast){ showResults(); } else { goToNextTurn(); }
    });
  }

  function fireCelebration(){
    var layer = el('celebrateLayer');
    layer.classList.remove('show');
    void layer.offsetWidth;
    layer.classList.add('show');
  }

  // ---------- between-turn overview ----------
  function goToNextTurn(){
    hide(el('growthScreen'));
    hide(el('turnIntro'));
    hide(el('choiceOverlay'));
    el('revealOverlay').classList.remove('active');
    var justPlayed = currentGroup();
    // Show BEFORE building the mini boards below: renderBoardInto measures
    // each stage's real width, and a still-[hidden] ancestor reports 0.
    show(el('overviewScreen'));
    var grid = el('overviewGrid');
    grid.innerHTML = '';
    state.groups.forEach(function(g){
      var item = document.createElement('div');
      item.className = 'overview-item';
      var stage = document.createElement('div');
      stage.className = 'mini-stage';
      if(!g.finished && g === justPlayed) stage.style.boxShadow = '0 0 0 3px ' + g.color + ', var(--shadow)';
      var inner = document.createElement('div');
      inner.className = 'board-inner';
      var layer = document.createElement('div');
      layer.className = 'cell-layer';
      inner.appendChild(layer);
      stage.appendChild(inner);
      var statusRow = document.createElement('div');
      statusRow.className = 'status-row mini-status-row';
      var groupChip = document.createElement('div');
      groupChip.className = 'group-chip';
      var matureTxt = g.finished ? ' · Fully Grown' : '';
      groupChip.innerHTML = '<span class="group-swatch" style="background:'+g.color+'"></span>'+g.name+matureTxt;
      var scoreChip = document.createElement('div');
      scoreChip.className = 'score-chip';
      scoreChip.innerHTML = '<span class="score-num">'+totalScore(g)+'</span><span class="score-label">points</span>';
      statusRow.appendChild(groupChip); statusRow.appendChild(scoreChip);
      item.appendChild(stage); item.appendChild(statusRow);
      grid.appendChild(item);
      // Same renderer as the real board, so the empty-cell grid (white
      // background + border lines) looks identical at any size - simplified
      // so a thumbnail this small just shows sky/soil + the plant, not
      // resource/wall markers too small to read.
      renderBoardInto(stage, layer, g, false, true);
    });

    // Built fresh every time this screen shows, off each group's current
    // totalScore() - by the time we get here the just-played group's score
    // already includes that turn, so the ranking and bar lengths are
    // automatically up to date.
    var board = el('scoreBoard');
    board.innerHTML = '';
    var ranked = state.groups.slice().sort(function(a,b){ return totalScore(b) - totalScore(a); });
    var maxScore = Math.max(1, totalScore(ranked[0]));
    var rank = 0, lastScore = null;
    ranked.forEach(function(g, i){
      var score = totalScore(g);
      if(score !== lastScore){ rank = i+1; lastScore = score; }
      var pct = Math.max(4, Math.round(score / maxScore * 100));
      var row = document.createElement('div');
      row.className = 'score-row';
      row.innerHTML =
        rankBadgeHtml(rank) +
        '<span class="score-row-name"><span class="group-swatch" style="background:'+g.color+'"></span>'+g.name+'</span>' +
        '<span class="score-bar"><span class="score-bar-fill" style="width:0%;background:'+g.color+';"></span></span>' +
        '<span class="score-row-num mono">0</span>';
      board.appendChild(row);
      animateBarWidth(row.querySelector('.score-bar-fill'), pct, i * 90);
      var numEl = row.querySelector('.score-row-num');
      if(REDUCE_MOTION) numEl.textContent = score;
      else setTimeout(function(){ animateScoreNum(numEl, score); }, i * 90);
    });

    // Waits for the teacher to tap Continue rather than auto-advancing, so
    // there's time to talk through how everyone's doing before moving on.
    el('overviewContinueBtn').onclick = function(){
      hide(el('overviewScreen'));
      advanceTurn();
    };
  }

  // ---------- advance turn: growth -> next intro ----------
  // Plain round-robin through every group, fully-grown or not - a fully
  // grown group's turn just shows that in showTurnIntro() and moves on.
  // The fixed round count is the only end condition: once the rotation
  // would wrap past state.maxRounds, the game ends instead.
  function advanceTurn(){
    var n = state.groups.length;
    var next = (state.currentIndex+1) % n;
    if(next <= state.currentIndex) state.round++;
    state.currentIndex = next;
    state.viewingIndex = next;
    state.pending = null;
    if(state.round > state.maxRounds){ showResults(); return; }
    hide(el('growthScreen'));
    show(el('turnIntro'));
    showTurnIntro();
  }

  el('endGameBtn').addEventListener('click', showResults);

  function bigRankBadgeHtml(rank){
    var bg = rank===1 ? 'var(--sun-deep)' : rank===2 ? '#B9C0C7' : rank===3 ? '#C98A4E' : 'var(--panel-2)';
    var fg = rank<=3 ? '#fff' : 'var(--ink)';
    return '<div class="result-rank-badge" style="background:'+bg+';color:'+fg+';">'+rank+'</div>';
  }

  // Ranking is always computed live from each group's current score, not
  // from a stored finish order - so this works identically whether the
  // fixed round count ran out or the teacher ended the game early. Tied
  // scores share a rank (1,1,3...), matching how the manual describes it.
  // Shows every group's board left-to-right in rank order, same simplified
  // renderer as the between-round overview, but with a big rank badge over
  // each one and a distinct gold-tinted backdrop so it doesn't read as just
  // another overview screen.
  function showResults(){
    hide(el('growthScreen'));
    hide(el('turnIntro'));
    hide(el('choiceOverlay'));
    hide(el('overviewScreen'));
    el('revealOverlay').classList.remove('active');
    // Show BEFORE building the boards below - renderBoardInto measures
    // each stage's real width, and a still-hidden ancestor reports 0.
    show(el('resultsScreen'));

    var sorted = state.groups.slice().sort(function(a,b){ return totalScore(b) - totalScore(a); });
    var grid = el('resultsGrid');
    grid.innerHTML = '';
    var rank = 0, lastScore = null;
    sorted.forEach(function(g, i){
      var score = totalScore(g);
      if(score !== lastScore){ rank = i+1; lastScore = score; }
      var item = document.createElement('div');
      item.className = 'result-item' + (rank <= 3 ? ' tier-' + rank : '');
      item.innerHTML = bigRankBadgeHtml(rank);
      var stage = document.createElement('div');
      stage.className = 'mini-stage';
      var inner = document.createElement('div');
      inner.className = 'board-inner';
      var layer = document.createElement('div');
      layer.className = 'cell-layer';
      inner.appendChild(layer);
      stage.appendChild(inner);
      var statusRow = document.createElement('div');
      statusRow.className = 'status-row mini-status-row';
      var groupChip = document.createElement('div');
      groupChip.className = 'group-chip';
      groupChip.innerHTML = '<span class="group-swatch" style="background:'+g.color+'"></span>'+g.name;
      var scoreChip = document.createElement('div');
      scoreChip.className = 'score-chip';
      scoreChip.innerHTML = '<span class="score-num">'+score+'</span><span class="score-label">points</span>';
      statusRow.appendChild(groupChip); statusRow.appendChild(scoreChip);
      item.appendChild(stage);
      item.appendChild(statusRow);
      grid.appendChild(item);
      renderBoardInto(stage, layer, g, false, true, rank === 1 ? topStemCellKey(g) : null);
    });
    sfxResults();
  }

  // The single furthest-grown stem cell (smallest/most negative row) -
  // where the winner's flower blooms on the results screen.
  function topStemCellKey(group){
    var best = null, bestRow = 0;
    Object.keys(group.cells).forEach(function(k){
      if(group.cells[k] !== 'stem') return;
      var row = +k.split(',')[1];
      if(row < bestRow){ bestRow = row; best = k; }
    });
    return best;
  }

  function resetToSetup(){
    el('revealOverlay').classList.remove('active');
    el('confirmOverlay').classList.remove('active');
    hide(el('growthScreen')); hide(el('turnIntro')); hide(el('choiceOverlay')); hide(el('readyScreen'));
    hide(el('tutorialScreen')); hide(el('overviewScreen')); hide(el('resultsScreen'));
    el('setupCard').hidden = false;
  }

  el('restartBtn').addEventListener('click', resetToSetup);

  // Available from any screen, not just the end-of-game results card - so
  // it needs its own confirmation since it can throw away a game in
  // progress. Uses a custom modal rather than window.confirm() - native
  // dialogs are blocked inside this sandboxed iframe and would otherwise
  // just silently do nothing when clicked.
  el('restartFab').addEventListener('click', function(){
    if(!state || el('setupCard').hidden === false){ resetToSetup(); return; }
    el('confirmOverlay').classList.add('active');
  });
  el('confirmCancelBtn').addEventListener('click', function(){
    el('confirmOverlay').classList.remove('active');
  });
  el('confirmRestartBtn').addEventListener('click', function(){
    el('confirmOverlay').classList.remove('active');
    resetToSetup();
  });

  // ---------- board rendering ----------
  // Cells sit on the col+row-even diagonal sublattice in plain screen
  // coordinates (no container rotation) and are each individually rotated
  // 45°, sized to their diagonal neighbor's spacing so they tile edge-to-
  // edge - that tiling fills the whole square stage (corners land in the
  // stage's own corners), while every tile still reads as a diamond.
  // Shared by the interactive main board and the read-only board shown on
  // the growth-choice screen, so "your plant so far" is the exact same full
  // board the player is about to act on, not a shrunken stand-in.
  // simplified skips resource/wall icons entirely (just the sky/soil
  // background and the plant itself) - used for the overview thumbnails,
  // which are too small for those markers to read clearly anyway.
  // bloomKey (a "col,row" key) marks a single cell to render a flower on
  // top of instead of its usual mark - only ever the winner's top stem
  // cell on the results screen.
  function renderBoardInto(stageEl, layerEl, group, interactive, simplified, bloomKey){
    stageEl.classList.toggle('finished', group.finished);
    // Cell math is sized off board-inner (the colored square inside the
    // white frame), not stageEl itself, since stageEl now includes the
    // frame's padding.
    var innerEl = stageEl.querySelector('.board-inner') || stageEl;
    var rect = innerEl.getBoundingClientRect();
    var size = rect.width || 500;
    var R = state.radius;
    var spacing = size / (2*R + 2.4);
    var cellSize = spacing * Math.SQRT2 * 1.04; // slight overlap so diamonds tile with no hairline gaps
    var cx = size/2, cy = size/2;

    layerEl.innerHTML = '';

    var targets = interactive ? currentValidTargets() : [];
    var isDamage = interactive && state.pending.outcome.kind === 'damage';
    var hlPart = interactive ? (isDamage ? state.pending.outcome.part : BRANCHES[state.pending.outcome.branch].part) : null;
    var spanningParent = buildSpanningParents(group);

    for(var row=-R; row<=R; row++){
      var maxCol = Math.abs(row); // bowtie: a cell this many steps from the seed row can be at most that far from center column
      for(var col=-maxCol; col<=maxCol; col+=2){
        var k = key(col,row);
        var type = group.cells[k];
        // Simplified thumbnails skip ungrown cells entirely - just the
        // sky/soil background shows through, no empty grid diamonds.
        if(simplified && !type) continue;
        // A resource token (water/nutrient/sunlight) sits on an otherwise-
        // empty cell and disappears the moment something grows into it. A
        // wall is permanent - it never gets grown into, just grown beside.
        var resource = (!type && !simplified) ? group.resources[k] : null;
        var isWall = !type && !simplified && group.walls[k];
        var isTarget = interactive && targets.some(function(t){ return t.col===col && t.row===row; });

        var cls = 'cell ' + (isWall ? 'wall' : (type || 'empty'));
        if(isTarget) cls += ' ' + (isDamage ? 'hl-danger' : (hlPart==='stem' ? 'hl-stem' : 'hl-root'));
        if(interactive) cls += ' clickable';

        var d = document.createElement('div');
        d.className = cls;
        d.dataset.col = col; d.dataset.row = row;
        d.style.width = cellSize + 'px';
        d.style.height = cellSize + 'px';
        d.style.left = (cx + col * spacing) + 'px';
        d.style.top = (cy + row * spacing) + 'px';
        if(type === 'stem' || type === 'root' || type === 'seed'){
          var fillVar = type === 'stem' ? 'var(--stem)' : type === 'root' ? 'var(--root)' : 'var(--seed)';
          var vine = connectionShapeSvg(treeConnections(spanningParent, col, row), fillVar);
          var overlay = type === 'seed' ? '<span class="cell-token">' + ICON_SEED + '</span>'
            : k === bloomKey ? '<span class="cell-flower">' + ICON_FLOWER + '</span>'
            : (type === 'stem' && group.litCells[k]) ? '<span class="cell-leaf">' + ICON_LEAF + '</span>' : '';
          d.innerHTML = vine + overlay;
        } else if(resource){
          var resIcon = resource==='water' ? ICON_WATER : resource==='nutrient' ? ICON_NUTRIENT : ICON_SUN;
          d.innerHTML = '<span class="cell-token">' + resIcon + '</span>';
        } else if(isWall){
          d.innerHTML = '<span class="cell-token">' + ICON_WALL + '</span>';
        }
        if(interactive){
          d.setAttribute('role','button');
          d.setAttribute('tabindex','0');
          (function(cc,rr){
            d.addEventListener('click', function(){ onCellClick(cc,rr); });
            d.addEventListener('keydown', function(e){
              if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onCellClick(cc,rr); }
            });
          })(col,row);
        }
        layerEl.appendChild(d);
      }
    }
  }

  // ---------- interactive tutorial ----------
  // A tiny hand-built practice group (never touches state.groups) that walks
  // a player through one real tap per event type - grow stem, grow roots,
  // the two-cell bonus versions, a wall bonus, both setbacks - before
  // explaining the win condition. Deliberately its own small engine rather
  // than reusing the real draw/pending machinery: every step here is
  // scripted (exact cell, exact outcome) instead of randomly drawn, and it
  // must never be able to mutate the real game groups mid-setup.
  var tutorialGroup = null;
  var tutorialSteps = null;
  var tutorialStepIndex = 0;

  function buildTutorialGroup(){
    var g = {
      name:'Practice', color:'#8CC63F', cells:{}, stemOrder:[], rootOrder:[],
      resources:{}, walls:{}, litCells:{}, score:0, finished:false
    };
    g.cells[key(0,0)] = 'seed';
    // Resources/wall sit a step or two away from the seed rather than on the
    // very first growth cell, so each gets tapped in its own dedicated step
    // later - never on the same tap as a plain "grow stem/root" demo.
    g.resources[key(-1,-3)] = 'sunlight';
    g.resources[key(0,2)] = 'water';
    g.resources[key(2,2)] = 'nutrient';
    g.walls[key(2,-2)] = true;
    return g;
  }

  // Every coordinate below is hand-verified to sit within radius 3 (inside
  // even the smallest allowed board) and to be a legal diagonal step from a
  // cell that already exists by the time that step runs. Covers all 6 real
  // OUTCOMES (stem, root, bonus_stem, bonus_root, prune, rot); sunlight,
  // water and walls each get their own step, entirely separate from the
  // grow-event steps, rather than riding along on a "grow stem/root" tap.
  function buildTutorialSteps(){
    return [
      { icon:ICON_STEM_GROW, title:'Grow Stem', desc:'Tap the glowing cell to grow your stem.',
        taps:[{ key:key(-1,-1), part:'stem' }],
        after:'Stems grow upward.' },
      { icon:ICON_STEM_GROW, title:'Strong Growth', desc:'Tap both glowing cells to grow 2 stem cells at once.',
        taps:[{ key:key(-2,-2), part:'stem' }, { key:key(0,-2), part:'stem' }],
        after:'2 stem cells in one turn!' },
      { icon:ICON_ROOT, title:'Grow Roots', desc:'Tap the glowing cell to grow your roots.',
        taps:[{ key:key(-1,1), part:'root' }],
        after:'Roots grow downward.' },
      { icon:ICON_ROOT, title:'Deep Roots', desc:'Tap both glowing cells to grow 2 root cells at once.',
        taps:[{ key:key(1,1), part:'root' }, { key:key(-2,2), part:'root' }],
        after:'2 root cells in one turn!' },
      { icon:ICON_SUN, title:'Sunlight', desc:'Tap the glowing cell to grow onto sunlight.',
        taps:[{ key:key(-1,-3), part:'stem' }],
        after:'+1 bonus point!' },
      { icon:ICON_WATER, title:'Water', desc:'Tap the glowing cell to grow onto water.',
        taps:[{ key:key(0,2), part:'root' }],
        after:'+1 bonus point!' },
      { icon:ICON_NUTRIENT, title:'Nutrients', desc:'Tap the glowing cell to grow onto nutrients.',
        taps:[{ key:key(2,2), part:'root' }],
        after:'+1 bonus point!' },
      { icon:ICON_WALL, title:'Wall', desc:'Tap the glowing cell to grow next to a wall.',
        taps:[{ key:key(1,-1), part:'stem' }],
        after:'Watch what happens...' },
      { icon:ICON_WALL, title:'Wall Bonus!', desc:'Tap the glowing cell for 1 free cell.',
        taps:[{ key:key(-3,-3), part:'stem' }],
        after:'A free cell!' }
    ].concat(state.allowSetbacks ? [
      { icon:ICON_PRUNE, title:'Pruned!', desc:'Tap the glowing cell to see a setback.',
        taps:[{ key:key(-3,-3), part:'stem', remove:true }],
        after:'A stem cell got removed.' },
      { icon:ICON_ROT, title:'Root Rot!', desc:'Tap the glowing cell.',
        taps:[{ key:key(-2,2), part:'root', remove:true }],
        after:'A root cell got removed.' }
    ] : []);
  }

  function startTutorial(){
    tutorialGroup = buildTutorialGroup();
    tutorialSteps = buildTutorialSteps();
    tutorialStepIndex = 0;
    el('tutorialScoreNum').textContent = '0';
    el('tutorialGoal').hidden = true;
    el('tutorialContinueBtn').hidden = true;
    showTutorialStep();
  }

  function renderTutorialBoard(){
    renderBoardInto(el('tutorialBoardStage'), el('tutorialCellLayer'), tutorialGroup, false, false);
  }

  function showTutorialStep(){
    if(tutorialStepIndex >= tutorialSteps.length){ showTutorialWinCondition(); return; }
    var step = tutorialSteps[tutorialStepIndex];
    el('tutorialResultSlot').innerHTML = '';
    el('tutorialInstruction').innerHTML = eventCardHtml(step);
    renderTutorialBoard();
    highlightTutorialTargets(step);
  }

  function highlightTutorialTargets(step){
    var layer = el('tutorialCellLayer');
    step.taps.forEach(function(tap){
      var p = tap.key.split(',');
      var cellEl = layer.querySelector('[data-col="'+p[0]+'"][data-row="'+p[1]+'"]');
      if(!cellEl) return;
      cellEl.classList.add('clickable', tap.remove ? 'hl-danger' : (tap.part==='stem' ? 'hl-stem' : 'hl-root'));
      cellEl.setAttribute('role','button');
      cellEl.setAttribute('tabindex','0');
      var handler = function(){ handleTutorialTap(step, tap); };
      cellEl.addEventListener('click', handler);
      cellEl.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); handler(); }
      });
    });
  }

  function handleTutorialTap(step, tap){
    if(tap.remove){
      delete tutorialGroup.cells[tap.key];
      var order = tap.part==='stem' ? tutorialGroup.stemOrder : tutorialGroup.rootOrder;
      var idx = order.indexOf(tap.key);
      if(idx !== -1) order.splice(idx,1);
    } else {
      tutorialGroup.cells[tap.key] = tap.part;
      (tap.part==='stem' ? tutorialGroup.stemOrder : tutorialGroup.rootOrder).push(tap.key);
      if(tutorialGroup.resources[tap.key]){
        var resType = tutorialGroup.resources[tap.key];
        delete tutorialGroup.resources[tap.key];
        tutorialGroup.score += 1;
        if(resType === 'sunlight') tutorialGroup.litCells[tap.key] = true;
      }
    }
    if(tap.remove) sfxSetback(); else sfxScoreUp();
    animateScoreNum(el('tutorialScoreNum'), totalScore(tutorialGroup));
    step.taps = step.taps.filter(function(t){ return t.key !== tap.key; });
    if(step.taps.length === 0){
      renderTutorialBoard();
      showTutorialAfter(step.after);
    } else {
      renderTutorialBoard();
      highlightTutorialTargets(step);
    }
  }

  function showTutorialAfter(message){
    var slot = el('tutorialResultSlot');
    slot.innerHTML = '';
    var banner = document.createElement('div');
    banner.className = 'result-banner';
    var msg = document.createElement('div');
    msg.textContent = message;
    var nextBtn = document.createElement('button');
    nextBtn.className = 'primary-btn';
    nextBtn.textContent = 'Next →';
    banner.appendChild(msg);
    banner.appendChild(nextBtn);
    slot.appendChild(banner);
    nextBtn.addEventListener('click', function(){
      tutorialStepIndex++;
      showTutorialStep();
    });
  }

  // Same "just the plant" look as the results screen's mini boards - no
  // grid diamonds, no wall icon, just what actually grew - topped with the
  // same winner's-bloom flower, so finishing the tutorial visually pays off
  // the same way finishing the real game does.
  function showTutorialWinCondition(){
    el('tutorialResultSlot').innerHTML = '';
    el('tutorialInstruction').innerHTML = '<div class="side-title">You’re Ready!</div>';
    renderBoardInto(el('tutorialBoardStage'), el('tutorialCellLayer'), tutorialGroup, false, true, topStemCellKey(tutorialGroup));
    el('tutorialGoal').hidden = false;
    el('tutorialContinueBtn').hidden = false;
  }

  function renderBoard(){
    var g = state.groups[state.viewingIndex];
    var interactive = !!state.pending && state.viewingIndex === state.currentIndex;
    renderBoardInto(el('boardStage'), el('cellLayer'), g, interactive);
  }

  window.addEventListener('resize', function(){ if(state && !el('growthScreen').hidden) renderBoard(); });
})();
</script>
